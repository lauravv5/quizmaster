<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link rel="stylesheet" href="results.css">
</head>

        <a class="btn" href="index.html">Volver al inicio</a>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz - Juego</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <main class="game-container">

    <header class="top-info">
      <div class="score-box">Puntos: <span id="score">0</span></div>

      <!-- vidas: 3 elementos .life -->
      <div class="lives-box" id="livesBox">
        <span class="life"></span>
        <span class="life"></span>
        <span class="life"></span>
      </div>
    </header>

    <section class="center-area">
      <div class="timer" aria-hidden="false" role="timer" aria-live="polite">
        <svg width="100" height="100" viewBox="0 0 100 100" >
          <circle cx="50" cy="50" r="40" stroke="#e6e8ff" stroke-width="8" fill="none"></circle>
          <!-- este es el circle que maneja strokeDashoffset -->
          <circle id="timer" cx="50" cy="50" r="40" stroke="#6f63ff" stroke-width="8" stroke-linecap="round" fill="none"></circle>
        </svg>
        <div id="timeText" class="time-text">0</div>
      </div>

      <div class="question-card" role="region" aria-live="polite">
        <p id="question">Cargando...</p>
      </div>

      <div class="options" id="optionsContainer" role="list">
        <button class="option" role="listitem" aria-label="Opción 1"></button>
        <button class="option" role="listitem" aria-label="Opción 2"></button>
        <button class="option" role="listitem" aria-label="Opción 3"></button>
        <button class="option" role="listitem" aria-label="Opción 4"></button>
        
      </div>
    </section>

  </main>

  <!-- sonidos (opcional) -->
   <audio id="bg-music" src="sounds/bg-music.mp3" preload="auto" loop></audio>
  <audio id="s-correct" src="sounds/correct.mp3" preload="auto"></audio>
  <audio id="s-wrong" src="sounds/wrong.mp3" preload="auto"></audio>
  <audio id="s-click" src="sounds/click.mp3" preload="auto"></audio>

  <!-- siempre poner el script al final -->
  <script src="game.js"></script>
</body>
</html>
